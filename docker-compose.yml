version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: task_manager_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=supersecretkey-production
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/task_manager_db
    depends_on:
      - db

volumes:
  postgres_data:
