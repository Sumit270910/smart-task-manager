services:
  - type: web
    name: smart-task-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k gthread --threads 10 -w 1 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString

databases:
  - name: task-manager-db
    databaseName: task_manager_db
    user: task_user
    plan: free
